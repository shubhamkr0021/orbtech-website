<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OrbTech — Log in</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: system-ui, sans-serif; max-width: 360px; margin: 4rem auto; padding: 0 1rem; }
  label { display: block; margin-top: 1rem; font-size: 0.9rem; }
  input { width: 100%; padding: 0.5rem; margin-top: 0.25rem; box-sizing: border-box; font-size: 1rem; }
  button { margin-top: 1.5rem; padding: 0.6rem 1.2rem; width: 100%; font-size: 1rem; }
  #status { color: #b00020; margin-top: 1rem; font-size: 0.9rem; min-height: 1.2em; }
</style>
</head>
<body>
  <h1>Log in</h1>
  <form id="login-form">
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="username">
    <label for="password">Password</label>
    <input type="password" id="password" required autocomplete="current-password">
    <button type="submit" id="submit-btn">Log in</button>
    <div id="status"></div>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
