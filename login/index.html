<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in - OrbTech</title>
<link rel="icon" type="image/png" href="../logo/orb_tech_icon_512px.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #080A0F; --bg-2: #0D1018;
  --surface: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.08); --border-2: rgba(255,255,255,0.14);
  --orange: #F25F1F; --orange-dim: rgba(242,95,31,0.15);
  --text: #F0F2F5; --text-2: #8892A0; --text-3: #68748A;
  --mono: 'DM Mono', monospace; --sans: 'Sora', sans-serif;
  --radius: 14px; --radius-lg: 22px;
}
body {
  font-family: var(--sans); background: var(--bg); color: var(--text);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 2rem 1rem; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
.card {
  width: 100%; max-width: 380px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 2.25rem 2rem;
}
.logo { display: flex; align-items: center; justify-content: center; margin-bottom: 1.75rem; }
.logo img { height: 32px; width: auto; }
h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.4rem; text-align: center; }
.subtitle { font-size: 0.85rem; color: var(--text-2); text-align: center; margin-bottom: 1.75rem; }
label { display: block; font-size: 0.8rem; color: var(--text-2); margin-bottom: 0.4rem; margin-top: 1rem; }
label:first-of-type { margin-top: 0; }
input[type="email"], input[type="password"] {
  width: 100%; padding: 0.7rem 0.9rem; background: var(--bg-2);
  border: 1.5px solid var(--border-2); border-radius: 10px; color: var(--text);
  font-family: var(--sans); font-size: 0.9rem; caret-color: var(--orange);
}
input:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-dim); }
input::placeholder { color: var(--text-3); }
button[type="submit"] {
  width: 100%; margin-top: 1.5rem; padding: 0.75rem 1rem; background: var(--orange);
  color: #fff; border: none; border-radius: 10px; font-family: var(--sans);
  font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: background 0.2s;
}
button[type="submit"]:hover:not(:disabled) { background: #D04E12; }
button[type="submit"]:disabled { opacity: 0.6; cursor: default; }
#resend-btn {
  display: none; width: 100%; margin-top: 0.6rem; padding: 0.6rem 1rem;
  background: transparent; color: var(--orange); border: 1.5px solid var(--orange);
  border-radius: 10px; font-family: var(--sans); font-weight: 600; font-size: 0.85rem;
  cursor: pointer; transition: background 0.2s;
}
#resend-btn:hover:not(:disabled) { background: var(--orange-dim); }
#status { min-height: 1.3em; margin-top: 1rem; font-size: 0.82rem; text-align: center; }
#status.error { color: #F87171; }
#status.success { color: #4ADE80; }
.footer-links { margin-top: 1.5rem; text-align: center; font-size: 0.82rem; color: var(--text-2); display: flex; justify-content: space-between; }
.footer-links a { color: var(--orange); text-decoration: none; font-weight: 600; }
.footer-links a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="../logo/orb_tech_logo.png" alt="OrbTech"></div>
    <h1>Log in</h1>
    <p class="subtitle">Welcome back.</p>

    <form id="login-form" autocomplete="on">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@company.com" required autocomplete="username">

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">

      <button type="submit" id="submit-btn">Log in</button>
      <button type="button" id="resend-btn">Resend verification email</button>
      <div id="status"></div>
    </form>

    <div class="footer-links">
      <a href="../reset-password/">Forgot password?</a>
      <a href="../signup/">Sign up</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.js" integrity="sha384-OUpie84zd1LdwNlK9uJJQRwab0BLqo3eKYKFh7hSVL58FSk7wPp2l0kfUMIIoaQd" crossorigin="anonymous"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/auth.js"></script>
  <script>initLoginPage();</script>
</body>
</html>
